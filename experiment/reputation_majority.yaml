# SPDX-License-Identifier: Apache-2.0
# Reputation scenario: agents trade and build/lose reputation.
name: reputation_majority
description: "Same 21-agent town, but malicious_fraction 0.5: 10 honest vs 10 malicious traders."

tier: 1
seed: 42

agents:
  count: 21
  brain: state-machine

layers:
  transport: in_memory
  comms: nest_native
  identity: did_key
  registry: in_memory
  auth: jwt
  trust: score_average
  payments: prepaid_credits
  coordination: contract_net
  negotiation: alternating_offers
  memory: blackboard
  privacy: noop
  datafacts: datafacts_v1

task:
  type: reputation
  config:
    rounds: 5
    malicious_fraction: 0.5

failures:
  message_drop: 0.0

duration: "ticks: 10000"

metrics:
  - success_rate
  - message_count
  - agent_count

output:
  trace: ./traces/rep_majority.jsonl